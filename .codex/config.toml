# Project-scoped MCP servers; existing global settings are preserved.
[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/d", "/c", "npx", "-y", "chrome-devtools-mcp@latest", "--headless", "--isolated", "--no-usage-statistics"]
startup_timeout_sec = 120

[mcp_servers.playwright]
command = "cmd"
args = ["/d", "/c", "npx", "-y", "@playwright/mcp@latest", "--headless", "--isolated"]
startup_timeout_sec = 120

[mcp_servers.context7]
command = "cmd"
args = ["/d", "/c", "npx", "-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 120
